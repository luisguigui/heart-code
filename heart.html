<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Heart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg:#050505;
      --pink:#ff4d6d;
      --pink2:#ff758f;
      --glow: 0 0 8px rgba(255,77,109,.95), 0 0 24px rgba(255,117,143,.55), 0 0 60px rgba(255,77,109,.18);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%}
    body{
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,77,109,.10), transparent 28%),
        radial-gradient(circle at 50% 50%, rgba(255,117,143,.08), transparent 40%),
        linear-gradient(180deg, #030303 0%, #060606 50%, #020202 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      perspective:1200px;
      font-family: Arial, sans-serif;
      color:white;
    }

    .bg-particles{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      opacity:.8;
    }
    .particle{
      position:absolute;
      border-radius:9999px;
      background: radial-gradient(circle, rgba(255,117,143,.95) 0%, rgba(255,77,109,.5) 35%, rgba(255,77,109,0) 70%);
      filter: blur(.2px);
      animation: floatUp linear infinite;
      box-shadow: 0 0 18px rgba(255,77,109,.35);
    }
    @keyframes floatUp{
      0%{transform:translateY(110vh) translateX(0) scale(.7);opacity:0}
      10%{opacity:.8}
      100%{transform:translateY(-20vh) translateX(var(--drift)) scale(1.25);opacity:0}
    }

    .scene{
      position:relative;
      width:min(82vw, 760px);
      height:min(82vw, 760px);
      max-width:760px;
      max-height:760px;
      display:flex;
      align-items:center;
      justify-content:center;
      transform-style:preserve-3d;
    }

    .heart-container{
      position:relative;
      width:min(78vw, 650px);
      height:min(78vw, 650px);
      transform-style:preserve-3d;
      animation: heart-pulse 5.8s infinite ease-in-out;
      filter: drop-shadow(0 0 18px rgba(255,77,109,.2));
    }

    .heart-core{
      position:absolute;
      inset:18%;
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 35%, rgba(255,255,255,.22), transparent 18%),
        radial-gradient(circle at 50% 50%, rgba(255,117,143,.55), rgba(255,77,109,.18) 46%, rgba(255,77,109,.03) 68%, transparent 72%);
      filter: blur(10px);
      animation: core-breath 5.8s infinite ease-in-out;
      transform: translateZ(50px);
      opacity:.9;
    }

    .heart-rim{
      position:absolute;
      inset:10%;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, transparent 42%, rgba(255,77,109,.12) 53%, rgba(255,117,143,.02) 70%, transparent 74%);
      filter: blur(2px);
      transform: translateZ(20px);
      opacity:.75;
    }

    .love-text{
      position:absolute;
      top:50%;
      left:50%;
      transform-style:preserve-3d;
      white-space:nowrap;
      user-select:none;
      pointer-events:none;
      font-size: clamp(10px, 1.25vw, 15px);
      font-weight: 700;
      letter-spacing: .02em;
      color:#ff91a4;
      text-shadow: var(--glow);
      opacity:0;
      will-change: transform, opacity, filter;
      animation: text-fade-in 4.8s infinite ease-in-out;
      filter: saturate(1.15);
    }

    .center-message{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
      pointer-events:none;
      transform: translateZ(120px);
    }

    .center-message h1{
      font-size: clamp(1.6rem, 3.5vw, 3.4rem);
      line-height:1;
      font-weight:900;
      letter-spacing:.08em;
      color:#fff;
      text-shadow: var(--glow);
      animation: title-glow 2.8s ease-in-out infinite;
    }

    .center-message p{
      margin-top:.9rem;
      font-size: clamp(.82rem, 1.3vw, 1rem);
      color: rgba(255, 214, 222, .88);
      letter-spacing:.22em;
      text-transform: uppercase;
    }

    .floating-note{
      position:fixed;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);
      font-size:.78rem;
      color:rgba(255,255,255,.55);
      letter-spacing:.12em;
      text-align:center;
      user-select:none;
      pointer-events:none;
    }

    @keyframes heart-pulse{
      0%   { transform: scale3d(1,1,1) rotateX(10deg) rotateY(0deg) rotateZ(0deg); }
      18%  { transform: scale3d(1.08,1.08,1.08) rotateX(10deg) rotateY(8deg) rotateZ(-1deg); }
      36%  { transform: scale3d(1.16,1.16,1.16) rotateX(10deg) rotateY(-7deg) rotateZ(1deg); }
      54%  { transform: scale3d(1.06,1.06,1.06) rotateX(10deg) rotateY(5deg) rotateZ(-.5deg); }
      72%  { transform: scale3d(1.2,1.2,1.2) rotateX(10deg) rotateY(-4deg) rotateZ(.5deg); }
      100% { transform: scale3d(1,1,1) rotateX(10deg) rotateY(0deg) rotateZ(0deg); }
    }

    @keyframes core-breath{
      0%,100% { transform: scale(.92) translateZ(50px); opacity:.78; }
      50%     { transform: scale(1.06) translateZ(70px); opacity:1; }
    }

    @keyframes text-fade-in{
      0%{
        opacity:0;
        transform: translate3d(var(--tx), var(--ty), -120px) rotateY(var(--ry)) scale(.8);
        filter: blur(1.5px);
      }
      18%{
        opacity:.92;
        filter: blur(0);
      }
      50%{
        opacity:1;
        transform: translate3d(calc(var(--tx) * 1.02), calc(var(--ty) * 1.02), 10px) rotateY(calc(var(--ry) + 10deg)) scale(1);
      }
      82%{
        opacity:.88;
      }
      100%{
        opacity:0;
        transform: translate3d(var(--tx), var(--ty), 220px) rotateY(calc(var(--ry) + 25deg)) scale(1.12);
        filter: blur(1px);
      }
    }

    @keyframes title-glow{
      0%,100%{text-shadow: 0 0 8px rgba(255,77,109,.9), 0 0 22px rgba(255,117,143,.5), 0 0 48px rgba(255,77,109,.15)}
      50%{text-shadow: 0 0 12px rgba(255,77,109,1), 0 0 30px rgba(255,117,143,.7), 0 0 80px rgba(255,77,109,.28)}
    }

    @media (max-width: 640px){
      .scene{ width: 96vw; height: 96vw; }
      .heart-container{ width: 92vw; height: 92vw; }
      .center-message p{ letter-spacing:.16em; }
    }
  </style>
</head>
<body>
  <div class="bg-particles" id="particles"></div>

  <main class="scene" aria-label="Coração animado">
    <div class="heart-container" id="heartContainer">
      <div class="heart-core"></div>
      <div class="heart-rim"></div>
      <div class="center-message">
        <h1>I LOVE YOU</h1>
        <p>para alguem que me ama</p>
      </div>
    </div>
  </main>

  <div class="floating-note">Animação 3D com coração em partículas luminosas</div>

  <script>
    const container = document.getElementById('heartContainer');
    const particles = document.getElementById('particles');
    const totalTexts = 260;

    function getHeartPosition(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    for (let i = 0; i < totalTexts; i++) {
      const span = document.createElement('span');
      span.className = 'love-text';
      span.innerText = 'I love you';

      const t = (i / totalTexts) * Math.PI * 2;
      const pos = getHeartPosition(t);

      const scaleX = 16.5;
      const scaleY = 16.5;
      const tx = (pos.x * scaleX) + (Math.random() - 0.5) * 24;
      const ty = (pos.y * scaleY) + (Math.random() - 0.5) * 24;
      const ry = `${Math.random() * 360}deg`;

      span.style.setProperty('--tx', `${tx}px`);
      span.style.setProperty('--ty', `${ty}px`);
      span.style.setProperty('--ry', ry);
      span.style.animationDelay = `${(i / totalTexts) * -4.8}s`;
      container.appendChild(span);
    }

    for (let i = 0; i < 28; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 3 + Math.random() * 8;
      p.style.width = `${size}px`;
      p.style.height = `${size}px`;
      p.style.left = `${Math.random() * 100}%`;
      p.style.setProperty('--drift', `${(Math.random() * 80 - 40)}px`);
      p.style.animationDuration = `${8 + Math.random() * 10}s`;
      p.style.animationDelay = `${-Math.random() * 12}s`;
      p.style.opacity = `${0.15 + Math.random() * 0.6}`;
      particles.appendChild(p);
    }
  </script>
</body>
</html>
